<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#004e89">
<meta name="description" content="Valor: swear oaths to your friends, prove them with photos, earn valor.">
<meta name="referrer" content="no-referrer">
<title>Valor</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Valor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<!-- The backend URL and public key for this deployment; generated, never committed. -->
<script src="env.js"></script>
<!-- Classic script on purpose: themes the page from ?colors= before first paint. -->
<script src="boot.js"></script>
</head>
<body>
<div class="stage">
  <aside class="desk-note" aria-label="About Valor">
    <img src="assets/cat/regal.webp" srcset="assets/cat/regal.webp 1x, assets/cat/regal@2x.webp 2x" alt="" width="96" height="96">
    <p class="desk-title">Valor</p>
    <p>Swear oaths to your friends, prove them with photos, earn valor.</p>
    <p>Made for your phone: open your invite link there and add Valor to your home screen.</p>
  </aside>
  <div class="phone" id="phone">
    <main class="app" id="app" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div class="layer" id="layer" hidden></div>
    <div class="splash" id="splash" aria-hidden="true">
      <img src="assets/cat/sword.webp" srcset="assets/cat/sword.webp 1x, assets/cat/sword@2x.webp 2x" alt="" width="180" height="180" class="bob">
      <p>Polishing the sword...</p>
    </div>
  </div>
</div>
<noscript><p class="noscript">Valor needs JavaScript to run.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
